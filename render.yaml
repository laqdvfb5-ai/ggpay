services:
  - type: web
    name: ezpay-receiver
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: ezpay-db, property: connectionString }
      - key: SEPAY_WEBHOOK_TOKEN
        generateValue: true
      - key: INSPECT_TOKEN
        generateValue: true
      - key: OUTBOUND_WEBHOOK_SECRET
        generateValue: true
      - key: OUTBOUND_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_ENCRYPTION_KEY
        generateValue: true
databases:
  - name: ezpay-db
    plan: free
